[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "advanced_trading_agent"
version = "0.1.0"
description = "多智能体量化交易分析系统 — A股盘后观察池"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2.0",
    "langgraph>=1.1.0",
    "langchain-core>=1.4.0",
    "langchain-openai>=1.0.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "tqdm>=4.66.0",
    "rich>=13.7.0",
    "pyyaml>=6.0",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3.0",
    "pytest-cov>=4.1.0",
]
# 免费数据源
akshare = ["akshare>=1.14.0"]
baostock = ["baostock>=0.8.9"]
yfinance = ["yfinance>=0.2.40"]
data = [
    "akshare>=1.14.0",
    "baostock>=0.8.9",
    "yfinance>=0.2.40",
]
# LLM 供应商
anthropic = ["anthropic>=0.84.0", "langchain-anthropic>=1.0.0"]
autogen = [
    "autogen-agentchat>=0.7.0",
    "autogen-ext[openai]>=0.7.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["advanced_trading_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
